<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TANGLAW Member Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, rgba(34, 211, 238, 0.18), transparent 35%), radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.16), transparent 25%), #020617; color: #e2e8f0; }
    .glass { background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(22px); border: 1px solid rgba(148, 163, 184, 0.16); }
    .input-glow:focus { box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16); }
    .receipt-overlay { inset: 0; background: rgba(15, 23, 42, 0.88); display: none; position: fixed; z-index: 50; justify-content: center; align-items: center; padding: 1.5rem; }
    .receipt-overlay.active { display: flex; }
    @media print {
      body { background: white; color: black; }
      .no-print, .receipt-overlay { display: none !important; }
      #receiptCard { display: block !important; }
      #receiptCard .print-only { display: block !important; }
      #receiptCard { box-shadow: none !important; width: auto !important; margin: 0; }
    }
  </style>
</head>
<body class="min-h-screen px-4 py-8 sm:px-6 lg:px-8 overflow-x-hidden">
  <div class="max-w-4xl mx-auto space-y-6">
    <header class="glass rounded-[2rem] p-6 shadow-2xl ring-1 ring-white/10 no-print">
      <div class="text-center">
        <p class="text-sm uppercase tracking-[0.34em] text-cyan-300/80">TANGLAW MEMBER PORTAL</p>
        <h1 class="mt-3 text-3xl font-semibold text-white">Submit Payment</h1>
        <p class="mt-2 text-sm text-slate-400">Upload your proof of payment and get your receipt instantly.</p>
      </div>
    </header>

    <main class="space-y-6">
      <section class="glass rounded-[2rem] p-6 shadow-2xl ring-1 ring-white/10">
        <h2 class="text-xl font-semibold text-white mb-6">Payment Form</h2>
        <div class="grid gap-4 lg:grid-cols-2">
          <input id="payerName" type="text" placeholder="Your full name" class="rounded-3xl border border-slate-700 bg-slate-950/90 px-4 py-3 text-slate-100 outline-none input-glow" />
          <input id="paymentAmount" type="number" placeholder="Amount paid" min="0" value="250" class="rounded-3xl border border-slate-700 bg-slate-950/90 px-4 py-3 text-slate-100 outline-none input-glow" />
          <input id="paymentNotes" type="text" placeholder="Payment notes (optional)" class="rounded-3xl border border-slate-700 bg-slate-950/90 px-4 py-3 text-slate-100 outline-none input-glow" />
          <label class="flex cursor-pointer items-center justify-between rounded-3xl border border-slate-700 bg-slate-950/90 px-4 py-3 text-slate-100 transition hover:border-cyan-500">
            <span>Upload receipt screenshot *</span>
            <input id="screenshotFile" type="file" accept="image/*" required class="hidden" />
          </label>
        </div>
        <div id="screenshotPreview" class="mt-4 hidden rounded-3xl border border-slate-700 bg-slate-950/90 p-4 text-slate-300"></div>
        <div class="mt-6">
          <button id="submitPayment" class="w-full rounded-3xl bg-cyan-500 px-6 py-3 text-sm font-semibold text-slate-950 transition hover:bg-cyan-400">Submit Payment & Generate Receipt</button>
        </div>
      </section>

      <div id="receiptCard" class="glass rounded-[2rem] p-6 shadow-2xl ring-1 ring-white/10 hidden print-card">
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-4">
            <div>
              <p class="text-sm uppercase tracking-[0.3em] text-slate-400">TANGLAW Receipt</p>
              <h2 class="text-2xl font-semibold text-white">Payment Invoice</h2>
            </div>
            <div class="text-right">
              <p id="receiptInvoice" class="text-sm font-semibold text-cyan-300"></p>
              <p id="receiptDate" class="text-xs uppercase tracking-[0.18em] text-slate-500"></p>
            </div>
          </div>
          <div class="grid gap-3 rounded-[1.75rem] bg-slate-950/90 p-5 text-sm text-slate-300">
            <p><span class="font-semibold text-slate-100">Payer:</span> <span id="receiptPayer"></span></p>
            <p><span class="font-semibold text-slate-100">Amount:</span> <span id="receiptAmount"></span></p>
            <p><span class="font-semibold text-slate-100">Notes:</span> <span id="receiptNotes"></span></p>
            <p><span class="font-semibold text-slate-100">Status:</span> <span id="receiptStatus">Pending Approval</span></p>
          </div>
          <div id="receiptScreenshot" class="hidden rounded-[1.75rem] bg-slate-900/90 p-4">
            <p class="text-xs uppercase tracking-[0.3em] text-slate-500 mb-3">Receipt Image</p>
            <img id="receiptScreenshotImg" src="" alt="Receipt Image" class="w-full rounded-3xl object-cover" />
          </div>
          <div class="flex flex-wrap gap-3 text-sm text-slate-400">
            <span class="rounded-3xl bg-slate-900/90 px-4 py-2">TNG-2026</span>
            <span class="rounded-3xl bg-slate-900/90 px-4 py-2">Pending Approval</span>
          </div>
          <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:justify-between">
            <button id="printReceiptBtn" class="rounded-3xl bg-cyan-500 px-6 py-3 text-sm font-semibold text-slate-950 transition hover:bg-cyan-400">Download Receipt</button>
            <button id="hideReceiptBtn" class="rounded-3xl border border-slate-700 px-6 py-3 text-sm font-semibold text-slate-100 transition hover:border-cyan-400">Close</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Firebase imports (same as admin)
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';
    import { getDatabase, ref, push, onValue, update } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js';
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-storage.js';

    const payerName = document.getElementById('payerName');
    const paymentAmount = document.getElementById('paymentAmount');
    const paymentNotes = document.getElementById('paymentNotes');
    const screenshotFile = document.getElementById('screenshotFile');
    const screenshotPreview = document.getElementById('screenshotPreview');
    const submitPayment = document.getElementById('submitPayment');
    const receiptCard = document.getElementById('receiptCard');
    const receiptInvoice = document.getElementById('receiptInvoice');
    const receiptDate = document.getElementById('receiptDate');
    const receiptPayer = document.getElementById('receiptPayer');
    const receiptAmount = document.getElementById('receiptAmount');
    const receiptNotes = document.getElementById('receiptNotes');
    const receiptStatus = document.getElementById('receiptStatus');
    const receiptScreenshot = document.getElementById('receiptScreenshot');
    const receiptScreenshotImg = document.getElementById('receiptScreenshotImg');
    const printReceiptBtn = document.getElementById('printReceiptBtn');
    const hideReceiptBtn = document.getElementById('hideReceiptBtn');

    const firebaseConfig = {
      apiKey: "AIzaSyAP2635k_OgOt_06h0E6QOLkkCY7bGEKcM",
      authDomain: "tanglaw-admin.firebaseapp.com",
      databaseURL: "https://tanglaw-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tanglaw-admin",
      storageBucket: "tanglaw-admin.firebasestorage.app",
      messagingSenderId: "580859101364",
      appId: "1:580859101364:web:a48fb0dac08b38cc1857e1",
      measurementId: "G-FGELNRSP4F"
    };

    let db, storage, firebaseEnabled = false;

    function tryInitializeFirebase() {
      try {
        const app = initializeApp(firebaseConfig);
        db = getDatabase(app);
        storage = getStorage(app);
        firebaseEnabled = true;
      } catch (error) {
        console.warn('Firebase initialization failed:', error);
        firebaseEnabled = false;
      }
    }

    function generateInvoiceId(index = Date.now()) {
      const suffix = String(index).slice(-3).padStart(3, '0');
      return `TNG-2026-${suffix}`;
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP', maximumFractionDigits: 0 }).format(amount).replace('PHP', '₱');
    }

    function uploadScreenshot(paymentId, file) {
      return new Promise((resolve, reject) => {
        if (!firebaseEnabled || !file) {
          resolve(null);
          return;
        }
        const storagePath = storageRef(storage, `paymentScreenshots/${paymentId}`);
        uploadBytes(storagePath, file)
          .then(() => getDownloadURL(storagePath))
          .then(resolve)
          .catch(error => {
            console.error('Upload failed:', error);
            reject(error);
          });
      });
    }

    function submitPaymentRecord() {
      const name = payerName.value.trim();
      const amount = Number(paymentAmount.value);
      const notes = paymentNotes.value.trim();
      const screenshot = screenshotFile.files[0];

      if (!name || !amount || amount <= 0) {
        alert('Provide your name and a valid amount.');
        return;
      }

      if (!screenshot) {
        alert('Please upload a receipt screenshot.');
        return;
      }

      // Set loading state
      submitPayment.disabled = true;
      submitPayment.textContent = 'Submitting...';

      const paymentKey = generateInvoiceId(Date.now());
      const record = {
        invoiceId: paymentKey,
        payer: name,
        amount,
        notes,
        status: 'pending',
        createdAt: Date.now(),
        updatedAt: Date.now(),
        screenshotUrl: null
      };

      uploadScreenshot(paymentKey, screenshot)
        .then(url => {
          record.screenshotUrl = url;
          if (firebaseEnabled) {
            update(ref(db, `payments/${paymentKey}`), record).catch(error => console.warn('Firebase save failed', error));
          }
          showReceipt(record);
        })
        .catch(() => {
          alert('Screenshot upload failed; please try again.');
        })
        .finally(() => {
          // Reset loading state
          submitPayment.disabled = false;
          submitPayment.textContent = 'Submit Payment & Generate Receipt';
          // Reset form
          payerName.value = '';
          paymentAmount.value = '';
          paymentNotes.value = '';
          screenshotFile.value = '';
          screenshotPreview.classList.add('hidden');
          screenshotPreview.textContent = '';
        });
    }

    function showReceipt(payment) {
      receiptInvoice.textContent = payment.invoiceId;
      receiptDate.textContent = new Date(payment.updatedAt).toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' });
      receiptPayer.textContent = payment.payer;
      receiptAmount.textContent = formatCurrency(payment.amount);
      receiptNotes.textContent = payment.notes || 'No additional notes';
      if (payment.screenshotUrl) {
        receiptScreenshotImg.src = payment.screenshotUrl;
        receiptScreenshot.classList.remove('hidden');
      } else {
        receiptScreenshotImg.src = '';
        receiptScreenshot.classList.add('hidden');
      }
      receiptCard.classList.remove('hidden');
    }

    function previewScreenshot() {
      const file = screenshotFile.files[0];
      if (!file) {
        screenshotPreview.classList.add('hidden');
        screenshotPreview.textContent = '';
        return;
      }
      const url = URL.createObjectURL(file);
      screenshotPreview.innerHTML = `<div class="space-y-2"><p class="text-xs uppercase tracking-[0.3em] text-slate-500">Selected screenshot</p><img src="${url}" alt="Screenshot preview" class="w-full rounded-3xl border border-slate-700 object-cover" /></div>`;
      screenshotPreview.classList.remove('hidden');
    }

    function generateReceiptImage() {
      html2canvas(receiptCard, { backgroundColor: null, scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `receipt-${receiptInvoice.textContent}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(error => {
        console.error('Failed to generate receipt image:', error);
        alert('Failed to generate receipt image. Please try again.');
      });
    }

    paymentAmount.addEventListener('input', () => {
      const current = Number(paymentAmount.value);
      if (current < 0) paymentAmount.value = '0';
    });

    screenshotFile.addEventListener('change', previewScreenshot);
    submitPayment.addEventListener('click', submitPaymentRecord);

    printReceiptBtn.addEventListener('click', () => generateReceiptImage());
    hideReceiptBtn.addEventListener('click', () => receiptCard.classList.add('hidden'));

    tryInitializeFirebase();
  </script>
</body>
</html>
